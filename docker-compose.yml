services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: javaneh_sabz
      POSTGRES_USER: javaneh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U javaneh -d javaneh_sabz"], interval: 5s, timeout: 5s, retries: 10}
  app:
    build: .
    restart: unless-stopped
    depends_on: {postgres: {condition: service_healthy}}
    environment:
      DATABASE_URL: postgresql://javaneh:${POSTGRES_PASSWORD}@postgres:5432/javaneh_sabz
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?Set NEXT_PUBLIC_APP_URL in .env}
      MEDIA_STORAGE_PROVIDER: local
      MEDIA_STORAGE_PATH: /app/data/uploads
      MEDIA_PUBLIC_URL: /media
      MAX_IMAGE_UPLOAD_MB: ${MAX_IMAGE_UPLOAD_MB:-10}
      MAX_VIDEO_UPLOAD_MB: ${MAX_VIDEO_UPLOAD_MB:-250}
    volumes: [app_media:/app/data/uploads]
    ports: ["127.0.0.1:3100:3000"]
volumes: {postgres_data: {}, app_media: {}}
